<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NEWS STUDIO - Live Broadcast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        .top-header { z-index: 100; }
        .sidebar-drawer { z-index: 40; }
        .sidebar-toggle-btn { z-index: 50; }
        .broadcast-controls-bottom { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 30; }
    </style>
</head>
<body class="dark-theme">
    <!-- Top Header -->
    <header class="top-header">
        <div class="brand-title">
            <div class="pulse-red"></div>
            <i class="fa-solid fa-satellite-dish"></i>
            <span>AI NEWS STUDIO <small>v2.5 PRO</small></span>
        </div>
        
        <div class="top-reporter-switcher">
            <span class="top-reporter-label"><i class="fa-solid fa-robot text-neon"></i> REPORTER:</span>
            <div class="top-reporter-pills">
                <button class="top-reporter-pill active" data-model="nexus_3d">🤖 NEXUS-3D</button>
                <button class="top-reporter-pill" data-model="humanoid_creature">🤖 NEXUS-9</button>
                <button class="top-reporter-pill" data-model="indian_ditto_male">👳 Arjun</button>
                <button class="top-reporter-pill" data-model="indian_female">👩 Priya</button>
                <button class="top-reporter-pill" data-model="indian_ditto_exec">💼 Vikram</button>
                <button class="top-reporter-pill" data-model="human_ditto_male">👤 Alexander</button>
            </div>
        </div>

        <div class="quick-stats">
            <span class="stat-badge"><i class="fa-solid fa-language"></i> <span id="currentLangLabel">Hindi</span></span>
        </div>
    </header>

    <!-- Sidebar Toggle -->
    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Toggle Sidebar">
        <i class="fa-solid fa-sliders"></i>
    </button>

    <!-- Sidebar -->
    <aside id="mainControlPanel" class="sidebar-drawer">
        <div class="panel-section">
            <h3><i class="fa-solid fa-language"></i> Language</h3>
            <select id="languageSelect" class="form-select">
                <option value="hi-IN" selected>🇮🇳 Hindi</option>
                <option value="en-US">🇺🇸 English</option>
                <option value="kn-IN">🇮🇳 Kannada</option>
                <option value="ta-IN">🇮🇳 Tamil</option>
                <option value="te-IN">🇮🇳 Telugu</option>
            </select>
        </div>

        <div class="panel-section">
            <h3><i class="fa-solid fa-newspaper"></i> News</h3>
            <select id="newsCategorySelect" class="form-select">
                <option value="india_tech">🇮🇳 India AI</option>
                <option value="isro_space">🚀 ISRO</option>
                <option value="tech">🌐 Technology</option>
                <option value="world">🌍 World News</option>
                <option value="finance">📈 Finance</option>
            </select>
        </div>

        <div class="panel-section">
            <h3><i class="fa-solid fa-comments"></i> Custom News</h3>
            <textarea id="customNewsBody" class="form-textarea" rows="5" placeholder="Enter your news..."></textarea>
            <button id="loadCustomBtn" class="btn-action primary" style="margin-top: 8px;">Load</button>
        </div>
    </aside>

    <!-- Canvas -->
    <canvas id="broadcastCanvas" width="1280" height="720"></canvas>

    <!-- Subtitle -->
    <div id="teleprompterSubtitleBox" class="subtitle-overlay style-yellow_black">
        <div id="subtitleTicker" class="subtitle-text">AI NEWS STUDIO - READY TO BROADCAST</div>
    </div>

    <!-- Controls -->
    <div class="broadcast-controls-bottom">
        <button id="startSpeechBtn" class="btn-control primary">
            <i class="fa-solid fa-play"></i> Start
        </button>
        <button id="pauseSpeechBtn" class="btn-control warning" disabled>
            <i class="fa-solid fa-pause"></i> Pause
        </button>
        <button id="stopSpeechBtn" class="btn-control danger" disabled>
            <i class="fa-solid fa-square"></i> Stop
        </button>
        <button id="nextNewsBtn" class="btn-control secondary">
            <i class="fa-solid fa-forward"></i> Next
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
